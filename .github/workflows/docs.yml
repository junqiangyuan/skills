name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate docs and skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check relative links, skill frontmatter, and required sections
        run: python3 scripts/check-docs

      # scripts/verify-skills is not on the default branch (open PR #10).
      # After that PR merges, add: ./scripts/verify-skills
      # There is no validate-pack on the default branch; this workflow does not add one.
